<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Pixel Engineer Wallpaper</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/frames/down_1.png">
</head>

<body>

  <div id="watermark">
    <div class="button-container">
      <button class="brutalist-button github">
        <div class="github-logo">
          <img src="https://github.com/owsam22.png" alt="owsam22" class="github-icon">
        </div>
        <div class="button-text">
          <span>made by <a href="https://github.com/owsam22" target="_blank">owsam22</a></span>
          <span id="wm-version-number">v0.0.0</span>
        </div>
      </button>
    </div>
  </div>

  <div id="time-display" class="glass-theme">
    <div class="day">Monday</div>
    <div class="date">Oct 24, 2023</div>
    <div class="time">00:00:00 AM</div>
  </div>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/versioncount.js"></script>

</body>

</html>
